<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<title>AI Music</title>

<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
--bg:#0b0c10;
--card:#1a1c29;
--muted:#a0a5bc;
--cyan:#00f2fe;
--purple:#8a2be2;
--border:rgba(255,255,255,.14)
}
*{box-sizing:border-box}
body{
margin:0;
background:var(--bg);
color:white;
font-family:Arial,Roboto,sans-serif;
padding-bottom:95px
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.app{max-width:600px;margin:auto;padding:15px}
.page{display:none}
.page.active{display:block}
header{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:25px
}
.logo{display:flex;align-items:center;gap:9px}
.logo i{font-size:28px;color:var(--cyan)}
.logo h2{font-size:21px;margin:0}
.logo small{color:var(--muted)}
.header-actions{display:flex;align-items:center;gap:8px}
.credit-box{
background:#202230;
border-radius:20px;
padding:8px 11px;
font-size:12px
}
.credit-box i{color:gold}
.small-btn{
border:0;
border-radius:10px;
background:var(--purple);
color:white;
padding:10px;
font-weight:bold
}
.icon-btn{
background:#202230;
border:1px solid var(--border);
color:white;
border-radius:50%;
width:38px;
height:38px
}
.hero{
background:linear-gradient(135deg,#1a1c29,#2a1844);
border-radius:22px;
padding:26px 21px;
margin-bottom:26px
}
.hero h1{
font-size:32px;
line-height:1.2;
margin:0 0 14px
}
.hero h1 span{color:var(--cyan)}
.hero p{
color:var(--muted);
font-size:14px;
line-height:1.6;
margin-bottom:22px
}
.primary{
width:100%;
border:0;
background:var(--purple);
color:white;
border-radius:24px;
padding:16px;
font-weight:bold;
display:flex;
justify-content:center;
align-items:center;
gap:10px
}
.section-heading{
display:flex;
justify-content:space-between;
align-items:center;
margin:25px 0 14px
}
.section-heading h3{margin:0;font-size:20px}
.link{
color:#59a0ff;
border:0;
background:none;
font-weight:bold
}
.categories{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:9px
}
.category{
border-radius:15px;
height:100px;
display:flex;
align-items:flex-end;
justify-content:center;
padding:10px 3px;
text-align:center;
font-size:12px;
font-weight:bold
}
.category i{
display:block;
font-size:27px;
margin-bottom:8px
}
.category:nth-child(1){
background:linear-gradient(145deg,#b01839,#270923)
}
.category:nth-child(2){
background:linear-gradient(145deg,#8a2be2,#27134c)
}
.category:nth-child(3){
background:linear-gradient(145deg,#16875b,#07352c)
}
.category:nth-child(4){
background:linear-gradient(145deg,#e17a22,#612312)
}
.back-row{
display:flex;
align-items:center;
gap:14px;
margin:10px 0 25px
}
.back-row h2{font-size:21px}
.back-btn{
width:44px;
height:44px;
background:#202230;
border:1px solid var(--border);
border-radius:50%;
color:white
}
.card{
background:#171923;
border:1px solid var(--border);
border-radius:20px;
padding:18px;
margin-bottom:20px
}
.label{
display:flex;
align-items:center;
gap:8px;
font-weight:bold;
margin-bottom:14px;
font-size:14px
}
.label i{color:var(--cyan)}
.required{color:#ff3b30}
.input,.textarea,.select{
width:100%;
background:#12141c;
color:white;
border:2px solid #8a2be266;
border-radius:14px;
padding:15px;
outline:none
}
.input{height:55px}
.textarea{
height:175px;
resize:vertical;
line-height:1.5
}
.style-textarea{height:135px}
.input:focus,.textarea:focus,.select:focus{
border-color:var(--cyan)
}
.select{height:55px}
.mode-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:13px
}
.mode-btn{
border:2px solid var(--border);
background:#12141c;
color:var(--muted);
border-radius:15px;
padding:15px 8px;
font-size:13px;
font-weight:bold
}
.mode-btn i{
display:block;
font-size:23px;
margin-bottom:8px
}
.mode-btn.active{
border-color:var(--cyan);
color:white;
background:linear-gradient(135deg,#8a2be244,#00f2fe22)
}
.mode-btn.active i{color:var(--cyan)}
.help{
font-size:12px;
color:var(--muted);
line-height:1.6;
margin:10px 0 0
}
.example{
font-size:12px;
color:var(--cyan);
line-height:1.5;
margin:12px 0 0
}
.tags{
display:flex;
flex-wrap:wrap;
gap:10px
}
.tag{
background:#202230;
border:1px solid var(--border);
color:var(--muted);
padding:12px;
border-radius:13px;
font-size:13px;
font-weight:bold
}
.tag.active{
border-color:var(--cyan);
color:white;
background:#00f2fe19
}
.tag.active i{color:var(--cyan)}
.clone{
text-align:center;
border:2px dashed var(--purple);
border-radius:15px;
padding:23px;
color:var(--muted)
}
.clone>i{
display:block;
font-size:30px;
color:gold;
margin-bottom:12px
}
.clone small{
display:inline-block;
background:#ffd70022;
color:gold;
padding:6px 12px;
border-radius:10px;
margin-top:10px
}
.tabs{display:flex;gap:10px;margin:20px 0}
.tab{
flex:1;
padding:13px;
border:1px solid var(--border);
background:transparent;
color:var(--muted);
border-radius:20px;
font-weight:bold
}
.tab.active{background:var(--purple);color:white}
.song-list{
display:flex;
flex-direction:column;
gap:12px;
margin:15px 0 25px
}
.song-card{
background:var(--card);
border:1px solid var(--border);
border-radius:18px;
padding:12px;
display:flex;
align-items:center;
gap:11px;
min-width:0
}
.thumb{
width:55px;
height:55px;
flex-shrink:0;
background:linear-gradient(135deg,var(--purple),#ff007f);
border-radius:13px;
display:grid;
place-items:center;
font-size:23px
}
.song-body{flex:1;min-width:0}
.song-title{
font-size:15px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}
.song-meta{
font-size:12px;
color:var(--muted);
margin-top:5px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}
.song-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:7px
}
.song-actions{display:flex;gap:11px}
.song-actions button{
background:none;
border:0;
color:var(--muted);
font-size:17px
}
.song-actions button.liked{color:#ff007f}
.player{
display:flex;
align-items:center;
gap:8px;
margin-top:13px;
min-width:0
}
.play{
border:0;
background:var(--purple);
color:white;
width:36px;
height:36px;
flex-shrink:0;
border-radius:50%;
display:grid;
place-items:center
}
.time{
font-size:11px;
color:var(--muted);
white-space:nowrap;
font-variant-numeric:tabular-nums
}
.progress{
appearance:none;
-webkit-appearance:none;
width:100%;
min-width:20px;
flex:1;
height:6px;
border-radius:20px;
outline:none;
border:0;
cursor:pointer;
background:linear-gradient(
to right,
var(--cyan) 0%,
var(--cyan) var(--progress,0%),
#424556 var(--progress,0%),
#424556 100%
)
}
.progress::-webkit-slider-thumb{
-webkit-appearance:none;
appearance:none;
width:15px;
height:15px;
border-radius:50%;
background:var(--cyan);
border:3px solid #fff;
box-shadow:0 0 8px #00f2fe66
}
.progress::-moz-range-thumb{
width:11px;
height:11px;
border-radius:50%;
background:var(--cyan);
border:3px solid white
}
.progress:disabled{opacity:.55;cursor:default}
.download{
border:1px solid #4a90e266;
background:none;
color:#59a0ff;
border-radius:9px;
padding:7px;
flex-shrink:0
}
.download.downloading{
color:var(--cyan);
border-color:var(--cyan)
}
.spinner{
height:40px;
width:40px;
flex-shrink:0;
border:3px solid #ffffff22;
border-top-color:var(--purple);
border-radius:50%;
animation:spin 1s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.pending-label{
color:var(--cyan);
font-size:11px;
font-weight:bold;
margin-bottom:5px
}
.pending-description{
color:var(--muted);
font-size:12px;
line-height:1.5;
margin-top:6px
}
.empty{
padding:30px 15px;
background:var(--card);
border-radius:17px;
text-align:center;
color:var(--muted)
}
.empty i{
display:block;
font-size:30px;
color:var(--purple);
margin-bottom:12px
}
.packages{
display:flex;
flex-direction:column;
gap:12px;
margin:20px 0
}
.package{
background:var(--card);
border:2px solid var(--border);
border-radius:16px;
padding:17px;
display:flex;
align-items:center;
justify-content:space-between;
gap:8px
}
.package.active{border-color:var(--purple)}
.package h4{margin:0 0 5px}
.package p{
margin:0;
color:var(--muted);
font-size:12px
}
.package strong{
white-space:nowrap;
font-size:14px
}
.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
display:none;
justify-content:space-around;
background:#0b0c10f5;
border-top:1px solid var(--border);
padding:12px 0 calc(13px + env(safe-area-inset-bottom));
z-index:100
}
.nav{
flex:1;
background:none;
border:0;
color:var(--muted);
display:flex;
align-items:center;
flex-direction:column;
gap:5px;
font-size:12px
}
.nav i{font-size:22px}
.nav.active{color:var(--purple)}
#language-page{
position:fixed;
inset:0;
z-index:200;
background:linear-gradient(180deg,#021a42,#010a1f);
display:none;
text-align:center;
padding:60px 20px;
overflow:auto
}
#language-page.active{display:block}
#language-page>i{
font-size:65px;
color:var(--cyan);
margin-bottom:25px
}
.lang-btn{
display:block;
width:100%;
max-width:400px;
margin:12px auto;
background:#032b69;
border:1px solid #00f2fe33;
color:white;
padding:19px;
border-radius:14px;
text-align:left;
font-weight:bold
}
.overlay{
position:fixed;
inset:0;
z-index:500;
background:#000d;
display:none;
align-items:center;
justify-content:center;
padding:20px
}
.overlay.show{display:flex}
.popup{
width:100%;
max-width:400px;
background:#161925;
border-radius:23px;
padding:25px 20px;
text-align:center
}
.popup>i{font-size:35px;color:var(--purple)}
.popup h3{margin:15px 0}
.popup p{
color:var(--muted);
line-height:1.6;
white-space:pre-line;
overflow-wrap:anywhere
}
.popup-buttons{
display:flex;
gap:10px;
margin-top:22px
}
.popup-buttons button{
flex:1;
background:var(--purple);
border:0;
color:white;
border-radius:14px;
padding:13px;
font-weight:bold
}
.popup-buttons .secondary{background:#ffffff19}
.toast{
position:fixed;
top:18px;
left:50%;
transform:translate(-50%,-100px);
opacity:0;
transition:.3s;
background:#00e676;
color:black;
border-radius:25px;
padding:13px 18px;
font-weight:bold;
z-index:1000;
max-width:90%;
text-align:center
}
.toast.show{
transform:translate(-50%,0);
opacity:1
}
.sheet{
position:fixed;
inset:0;
z-index:450;
background:#000b;
display:none;
align-items:flex-end
}
.sheet.show{display:flex}
.sheet-inner{
width:100%;
max-width:600px;
margin:auto;
background:#161925;
border-radius:24px 24px 0 0;
padding:25px 20px calc(25px + env(safe-area-inset-bottom))
}
.sheet-option{
display:block;
width:100%;
padding:17px;
background:#ffffff09;
color:white;
border:0;
border-radius:12px;
text-align:left;
margin-top:10px
}
.sheet-option i{
width:30px;
color:var(--purple)
}
@media(max-width:380px){
.categories{grid-template-columns:repeat(2,1fr)}
.logo h2{font-size:18px}
.thumb{width:46px;height:46px}
.song-card{padding:9px;gap:8px}
.player{gap:5px}
.time{font-size:10px}
}
</style>
</head>

<body>

<div id="language-page">
<i class="fa-solid fa-globe"></i>
<h2>Select Language</h2>
<p>Chagua Lugha</p>
<button class="lang-btn" onclick="selectLanguage('en')">🇬🇧 English</button>
<button class="lang-btn" onclick="selectLanguage('sw')">🇹🇿 Kiswahili</button>
<button class="lang-btn" onclick="selectLanguage('fr')">🇫🇷 Français</button>
</div>

<div class="app" id="app" style="display:none">

<section class="page" id="home-page">
<header>
<div class="logo">
<i class="fa-solid fa-wave-square"></i>
<div>
<h2>AI Music</h2>
<small data-t="subtitle"></small>
</div>
</div>

<div class="header-actions">
<div class="credit-box">
<i class="fa-solid fa-coins"></i> Credits —
</div>
<button class="small-btn" onclick="switchPage('topup-page')" data-t="add"></button>
<button class="icon-btn" onclick="openSettings()">
<i class="fa-solid fa-bars"></i>
</button>
</div>
</header>

<div class="hero">
<h1 data-html="hero"></h1>
<p data-t="heroDesc"></p>
<button class="primary" onclick="switchPage('create-page')">
<i class="fa-solid fa-wand-magic-sparkles"></i>
<span data-t="newSong"></span>
<i class="fa-solid fa-arrow-right"></i>
</button>
</div>

<div class="section-heading">
<h3 data-t="genres"></h3>
<button class="link" onclick="switchPage('create-page')" data-t="viewAll"></button>
</div>

<div class="categories">
<div class="category">
<div><i class="fa-solid fa-fire"></i>Bongo Flava</div>
</div>
<div class="category">
<div><i class="fa-solid fa-drum"></i>Singeli</div>
</div>
<div class="category">
<div><i class="fa-solid fa-record-vinyl"></i>Amapiano</div>
</div>
<div class="category">
<div><i class="fa-solid fa-music"></i>Afrobeat</div>
</div>
</div>

<div class="section-heading">
<h3 data-t="recent"></h3>
<button class="link" onclick="switchPage('music-page')" data-t="viewAll"></button>
</div>

<div class="song-list" id="recent-songs"></div>
</section>

<section class="page" id="create-page">

<div class="back-row">
<button class="back-btn" onclick="switchPage('home-page')">
<i class="fa-solid fa-arrow-left"></i>
</button>
<h2 data-t="create"></h2>
</div>

<div class="card">
<div class="label">
<i class="fa-solid fa-sliders"></i>
<span data-t="chooseMode"></span>
</div>

<div class="mode-grid">
<button class="mode-btn active" id="auto-btn" onclick="setMode('automatic')">
<i class="fa-solid fa-wand-magic-sparkles"></i>
<span data-t="autoMode"></span>
</button>

<button class="mode-btn" id="custom-btn" onclick="setMode('custom')">
<i class="fa-solid fa-pen-nib"></i>
<span data-t="customMode"></span>
</button>
</div>

<p class="help" id="mode-help"></p>
</div>

<div class="card" id="title-card" style="display:none">
<label class="label" for="song-title">
<i class="fa-solid fa-signature"></i>
<span data-t="songTitle"></span>
<span class="required">*</span>
</label>
<input id="song-title" class="input" maxlength="80">
</div>

<div class="card">
<label class="label" for="song-prompt">
<i class="fa-solid fa-pen-nib"></i>
<span id="prompt-label"></span>
<span class="required">*</span>
</label>

<textarea
id="song-prompt"
class="textarea"
maxlength="5000"
></textarea>

<p class="example" id="prompt-example"></p>
</div>

<div class="card">
<label class="label" for="song-language">
<i class="fa-solid fa-globe"></i>
<span data-t="songLanguage"></span>
</label>

<select class="select" id="song-language">
<option value="Swahili">🇹🇿 Kiswahili / Swahili</option>
<option value="English">🇬🇧 English</option>
<option value="French">🇫🇷 Français / French</option>
<option value="Spanish">🇪🇸 Español / Spanish</option>
<option value="Portuguese">🇵🇹 Português / Portuguese</option>
<option value="Arabic">🇸🇦 العربية / Arabic</option>
<option value="Hindi">🇮🇳 हिन्दी / Hindi</option>
<option value="Other">🌍 Other</option>
</select>

<p class="help" data-t="languageHelp"></p>
</div>

<div class="card">
<label class="label" for="music-style">
<i class="fa-solid fa-guitar"></i>
<span data-t="musicStyle"></span>
<span class="required">*</span>
</label>

<textarea
id="music-style"
class="textarea style-textarea"
maxlength="600"
></textarea>

<p class="example" data-t="styleExample"></p>
<p class="help" data-t="styleHelp"></p>
</div>

<div class="card">
<div class="label">
<i class="fa-solid fa-microphone"></i>
<span data-t="vocal"></span>
</div>

<div class="tags" id="voice-tags">
<button class="tag active" data-voice="Female">
<i class="fa-solid fa-person-dress"></i>
<span data-t="female"></span>
</button>

<button class="tag" data-voice="Male">
<i class="fa-solid fa-person"></i>
<span data-t="male"></span>
</button>
</div>
</div>

<div class="card">
<div class="label">
<i class="fa-solid fa-crown"></i>
<span data-t="cloning"></span>
</div>

<div class="clone" onclick="showPopup('Voice Cloning',tr('cloneUnavailable'))">
<i class="fa-solid fa-lock"></i>
<span data-t="cloneDesc"></span><br>
<small>👑 <span data-t="locked"></span></small>
</div>
</div>

<button class="primary" id="generate-btn" onclick="generateSong()">
<i class="fa-solid fa-wand-magic-sparkles"></i>
<span data-t="generate"></span>
<span style="background:#0005;border-radius:8px;padding:5px 8px;font-size:12px">
-1 Credit
</span>
</button>

</section>

<section class="page" id="music-page">
<header>
<div class="logo">
<i class="fa-solid fa-wave-square"></i>
<div>
<h2>AI Music</h2>
<small data-t="subtitle"></small>
</div>
</div>

<div class="header-actions">
<div class="credit-box">
<i class="fa-solid fa-coins"></i> Credits —
</div>
<button class="small-btn" onclick="switchPage('topup-page')" data-t="add"></button>
</div>
</header>

<h2 data-t="mySongs"></h2>
<p style="color:var(--muted)" data-t="mySongsDesc"></p>

<div class="tabs">
<button class="tab active" data-tab="all" onclick="setTab('all')">
♫ <span data-t="all"></span>
</button>

<button class="tab" data-tab="favorites" onclick="setTab('favorites')">
♡ <span data-t="favorites"></span>
</button>
</div>

<div class="song-list" id="all-songs"></div>
</section>

<section class="page" id="topup-page">
<header>
<div class="logo">
<i class="fa-solid fa-wave-square"></i>
<div>
<h2>AI Music</h2>
<small data-t="buy"></small>
</div>
</div>

<button class="icon-btn" onclick="switchPage('home-page')">
<i class="fa-solid fa-xmark"></i>
</button>
</header>

<div class="hero">
<h2 data-t="more"></h2>
<p data-t="buyDesc"></p>
</div>

<h3 data-t="package"></h3>

<div class="packages">
<div class="package active" data-price="2000" onclick="selectPackage(2000)">
<div>
<h4>🪙 5 Credits</h4>
<p>5 Songs</p>
</div>
<strong>Tsh 2,000</strong>
</div>

<div class="package" data-price="5000" onclick="selectPackage(5000)">
<div>
<h4>🪙 15 Credits</h4>
<p>15 Songs</p>
</div>
<strong>Tsh 5,000</strong>
</div>

<div class="package" data-price="10000" onclick="selectPackage(10000)">
<div>
<h4>👑 30 Credits</h4>
<p>30 Songs + Voice Cloning</p>
</div>
<strong>Tsh 10,000</strong>
</div>
</div>

<button class="primary" onclick="showPopup(tr('payment'),tr('paymentUnavailable'))">
<i class="fa-solid fa-lock"></i>
<span id="pay-text">LIPA TSH 2,000</span>
</button>
</section>

</div>

// ==========================================
// HELPERS
// ==========================================

function tr(key){
return translations[lang]?.[key]||
translations.sw[key]||
key;
}

function el(id){
return document.getElementById(id);
}

function escapeHTML(value){
return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#39;");
}

function validURL(value){
try{
const u=new URL(value);
return ["https:","http:"].includes(u.protocol)
?u.href
:"";
}catch{
return "";
}
}

function formatTime(value){
const n=Number(value);

if(!Number.isFinite(n)||n<0){
return "--:--";
}

return Math.floor(n/60)+":"+
String(Math.floor(n%60)).padStart(2,"0");
}

function safeFilename(value){
return String(value||"AI Music")
.replace(/[<>:"/\\|?*\x00-\x1F]/g,"")
.trim()
.slice(0,100)||"AI Music";
}

function save(){
try{
localStorage.setItem(
SONGS_KEY,
JSON.stringify(songs)
);

localStorage.setItem(
TASKS_KEY,
JSON.stringify(tasks)
);
}catch(error){
console.warn("Storage:",error);
}
}

function load(){
try{
const s=JSON.parse(
localStorage.getItem(SONGS_KEY)||"[]"
);

const t=JSON.parse(
localStorage.getItem(TASKS_KEY)||"[]"
);

songs=Array.isArray(s)
?s.filter(x=>x&&validURL(x.audioUrl))
:[];

tasks=Array.isArray(t)
?t.filter(x=>x&&x.task_id)
:[];

}catch(error){
console.warn("Load:",error);
songs=[];
tasks=[];
}
}

// ==========================================
// API
// ==========================================

async function requestJSON(url,options={}){

const response=await fetch(
url,
{
cache:"no-store",
...options
}
);

const text=await response.text();

let data;

try{
data=JSON.parse(text);
}catch{
throw new Error(
"Backend did not return valid JSON."
);
}

if(!response.ok||data.success===false){

throw new Error(
typeof data.error==="string"
?data.error
:tr("requestError")+" ("+response.status+")"
);

}

return data;

}

// ==========================================
// GENERATE SONG
// ==========================================

async function generateSong(){

if(generating)return;

const isCustom=mode==="custom";

const title=isCustom
?el("song-title").value.trim()
:"";

const prompt=el("song-prompt").value.trim();

const musicStyle=el("music-style").value.trim();

if(
!prompt||
!musicStyle||
(isCustom&&!title)
){

showPopup("AI Music",tr("required"));
return;

}

if(title.length>80){
showPopup("AI Music","Jina la wimbo ni refu sana.");
return;
}

if(prompt.length>(isCustom?5000:2500)){
showPopup("AI Music","Maandishi ni marefu sana.");
return;
}

if(musicStyle.length>600){
showPopup("AI Music","Music Style ni ndefu sana.");
return;
}

const password=window.prompt(
tr("testPassword")
);

if(password===null||!password.trim()){
return;
}

const voice=selectedTag(
"voice-tags",
"voice",
"Female"
);

const songLanguage=
el("song-language").value;

const pendingTitle=isCustom
?title
:(lang==="sw"
?"Wimbo Mpya"
:lang==="fr"
?"Nouvelle Chanson"
:"New Song");

const localId=
"local-"+crypto.randomUUID();

const task={
task_id:localId,
title:pendingTitle,
userTitle:title,
mode,
musicStyle,
voice,
songLanguage,
createdAt:Date.now(),
status:"submitting"
};

generating=true;

const generateButton=el("generate-btn");
generateButton.disabled=true;

// Onyesha pending song papo hapo.
tasks.unshift(task);

save();
renderSongs();

// Rudi Home kabla ya kusubiri reAPI.
switchPage("home-page");

toast(tr("submitted"));

try{

const result=await requestJSON(
GENERATE_URL,
{
method:"POST",
headers:{
"Content-Type":"application/json",
"x-test-password":password
},
body:JSON.stringify({
title,
prompt,
musicStyle,
voice,
mode,
songLanguage
})
}
);

const taskId=String(
result.task_id||
result.taskId||
""
);

if(!taskId){
throw new Error(tr("noTaskId"));
}

task.task_id=taskId;
task.status="processing";

save();
renderSongs();

el("song-title").value="";
el("song-prompt").value="";

pollTask(taskId,true);

}catch(error){

task.status="failed";
task.error=error.message||tr("requestError");

save();
renderSongs();

showPopup("AI Music",task.error);

}finally{

generating=false;
generateButton.disabled=false;

}

}

// ==========================================
// PARSE RESULT
// ==========================================

function parseResult(payload){

const root=payload||{};

const state=String(
root.status||
root.state||
root.data?.status||
""
).toLowerCase();

if(
[
"failed",
"failure",
"error",
"cancelled",
"canceled"
].includes(state)
){

return {
state:"failed",
error:root.error||root.message||tr("failed"),
songs:[]
};

}

const found=[];
const seen=new WeakSet();

function scan(value,depth=0){

if(!value||depth>8)return;

if(Array.isArray(value)){
value.forEach(x=>scan(x,depth+1));
return;
}

if(
typeof value!=="object"||
seen.has(value)
){
return;
}

seen.add(value);

const url=validURL(
value.audioUrl||
value.audio_url||
value.music_url||
value.musicUrl||
value.song_url||
value.stream_url||
value.play_url||
value.audio||
value.url
);

if(
url&&
!found.some(x=>x.audioUrl===url)
){

found.push({
title:value.title||value.song_name||"",
audioUrl:url,
duration:Number(
value.duration||
value.duration_seconds||
0
)
});

}

Object.entries(value).forEach(([key,child])=>{

if(
child&&
typeof child==="object"&&
key!=="metadata"
){
scan(child,depth+1);
}

});

}

scan(root.songs||root);

return {
state:found.length
?"completed"
:"processing",
songs:found
};

}

// ==========================================
// CHECK TASK
// ==========================================

async function checkTask(taskId){

const response=await requestJSON(
STATUS_URL+
"?task_id="+
encodeURIComponent(taskId)
);

const result=parseResult(response);

const task=tasks.find(
t=>t.task_id===taskId
);

if(!task)return true;

if(result.state==="failed"){

task.status="failed";
task.error=result.error||tr("failed");

save();
renderSongs();

return true;

}

if(result.state==="completed"){

const existing=new Set(
songs.map(s=>s.audioUrl)
);

result.songs.forEach((item,index)=>{

if(existing.has(item.audioUrl)){
return;
}

const isCustom=
task.mode==="custom"||
(
!task.mode&&
Boolean(task.title)&&
task.title!=="Wimbo Mpya"&&
task.title!=="New Song"&&
task.title!=="Nouvelle Chanson"
);

const correctTitle=isCustom
?String(
task.userTitle||
task.title||
item.title||
"AI Music"
).trim()
:String(
item.title||
"AI Music"
).trim();

songs.unshift({

id:taskId+"-"+index,
taskId,
trackIndex:index,

title:correctTitle,

musicStyle:
task.musicStyle||
task.genre||
"AI Music",

genre:
task.musicStyle||
task.genre||
"AI Music",

voice:task.voice||"",
songLanguage:task.songLanguage||"",
audioUrl:item.audioUrl,
duration:item.duration||0,

time:item.duration
?formatTime(item.duration)
:"--:--",

isFav:false,
createdAt:Date.now()

});

existing.add(item.audioUrl);

});

tasks=tasks.filter(
t=>t.task_id!==taskId
);

save();
renderSongs();

toast(tr("ready"));

return true;

}

task.status="processing";

save();
renderSongs();

return false;

}

// ==========================================
// POLLING
// ==========================================

function sleep(ms){
return new Promise(resolve=>{
setTimeout(resolve,ms);
});
}

async function pollTask(taskId,immediate=false){

if(
!taskId||
polling.has(taskId)
){
return;
}

polling.add(taskId);

try{

for(
let attempt=0;
attempt<MAX_POLLS;
attempt++
){

if(
!tasks.some(t=>t.task_id===taskId)
){
return;
}

if(attempt>0||!immediate){
await sleep(POLL_INTERVAL);
}

if(document.hidden){
await sleep(POLL_INTERVAL);
}

try{

const finished=await checkTask(taskId);

if(finished)return;

}catch(error){

console.warn(
"reAPI status:",
error.message
);

const task=tasks.find(
t=>t.task_id===taskId
);

if(task){
task.status="checking";
save();
renderSongs();
}

}

}

const task=tasks.find(
t=>t.task_id===taskId
);

if(task){
task.status="waiting";
save();
renderSongs();
}

}finally{

polling.delete(taskId);

}

}

function resumeTasks(){

tasks
.filter(t=>
t.status!=="failed"&&
t.status!=="submitting"&&
!String(t.task_id).startsWith("local-")
)
.forEach(t=>{
pollTask(t.task_id,true);
});

}

document.addEventListener(
"visibilitychange",
()=>{
if(!document.hidden){
resumeTasks();
}
}
);

window.addEventListener(
"online",
resumeTasks
);

// ==========================================
// SONG HTML
// ==========================================

function songHTML(song){

const id=escapeHTML(song.id);

const title=escapeHTML(
song.title||"AI Music"
);

const genre=escapeHTML(
song.musicStyle||
song.genre||
"AI Music"
);

const duration=escapeHTML(
song.time||"--:--"
);

const fav=Boolean(song.isFav);

return `
<div class="song-card" data-song-id="${id}">

<div class="thumb">
<i class="fa-solid fa-music"></i>
</div>

<div class="song-body">

<div class="song-top">

<div style="min-width:0;flex:1">

<div class="song-title">${title}</div>

<div class="song-meta">${genre}</div>

</div>

<div class="song-actions">

<button
data-action="favorite"
data-id="${id}"
class="${fav?"liked":""}"
aria-label="Favorite"
>
<i class="${fav?"fa-solid":"fa-regular"} fa-heart"></i>
</button>

<button
data-action="options"
data-id="${id}"
aria-label="Options"
>
<i class="fa-solid fa-ellipsis-vertical"></i>
</button>

</div>
</div>

<div class="player">

<button
class="play"
data-action="play"
data-id="${id}"
aria-label="Play"
>
<i class="fa-solid fa-play"></i>
</button>

<span class="time elapsed">0:00</span>

<input
type="range"
class="progress"
data-song-id="${id}"
min="0"
max="${Math.max(1,Number(song.duration)||1)}"
value="0"
step="0.1"
style="--progress:0%"
aria-label="Song progress"
>

<span class="time total-time">${duration}</span>

<button
class="download"
data-action="download"
data-id="${id}"
aria-label="Download"
>
<i class="fa-solid fa-download"></i>
</button>

</div>

</div>
</div>
`;

}

// ==========================================
// PENDING HTML
// ==========================================

function pendingHTML(task){

let message=tr("processing");

if(task.status==="submitting"){
message=tr("submitting");
}

if(task.status==="checking"){
message=tr("checking");
}

if(task.status==="waiting"){
message=tr("waiting");
}

if(task.status==="failed"){
message=task.error||tr("failed");
}

const failed=task.status==="failed";

return `
<div class="song-card">

${failed
?'<div class="thumb"><i class="fa-solid fa-triangle-exclamation"></i></div>'
:'<div class="spinner"></div>'}

<div class="song-body">

<div class="pending-label">
${failed?"FAILED":"PROCESSING"}
</div>

<div class="song-title">
${escapeHTML(task.title||"AI Music")}
</div>

<div class="pending-description">
${escapeHTML(message)}
</div>

${failed
?`
<button
class="download"
data-action="remove-task"
data-id="${escapeHTML(task.task_id)}"
style="margin-top:9px"
>
${escapeHTML(tr("remove"))}
</button>
`
:""}

</div>
</div>
`;

}

// ==========================================
// RENDER
// ==========================================

function renderSongs(){

const recent=el("recent-songs");
const all=el("all-songs");

if(!recent||!all)return;

const pending=tasks.map(
pendingHTML
).join("");

const recentHTML=songs
.slice(0,3)
.map(songHTML)
.join("");

const empty=`
<div class="empty">
<i class="fa-solid fa-music"></i>
${escapeHTML(tr("noSongs"))}
</div>
`;

recent.innerHTML=
(pending+recentHTML)||empty;

const visible=
currentTab==="favorites"
?songs.filter(s=>s.isFav)
:songs;

all.innerHTML=
(
(currentTab==="all"?pending:"")+
visible.map(songHTML).join("")
)||empty;

updatePlayerButtons();
updatePlayerProgress();
updateDownloadButtons();

}

// ==========================================
// TABS
// ==========================================

function setTab(tab){

currentTab=
tab==="favorites"
?"favorites"
:"all";

document.querySelectorAll(".tab").forEach(x=>{
x.classList.toggle(
"active",
x.dataset.tab===currentTab
);
});

renderSongs();

}

// ==========================================
// AUDIO PLAYER
// ==========================================

async function playSong(id){

const song=songs.find(
s=>s.id===id
);

if(!song)return;

if(
currentSongId===id&&
!audio.paused
){
audio.pause();
return;
}

if(currentSongId!==id){

audio.pause();

currentSongId=id;
audioLoading=true;

audio.src=song.audioUrl;
audio.load();

}

try{

await audio.play();

}catch(error){

if(error.name!=="AbortError"){
showPopup(
"Audio",
tr("audioError")+" "+error.message
);
}

}

updatePlayerButtons();

}

function updatePlayerButtons(){

document.querySelectorAll(".play").forEach(button=>{

const active=
button.dataset.id===currentSongId;

const playing=active&&!audio.paused;

const loading=active&&audioLoading;

const icon=button.querySelector("i");

if(icon){

icon.className=loading
?"fa-solid fa-spinner fa-spin"
:"fa-solid fa-"+(
playing?"pause":"play"
);

}

button.style.background=
playing
?"#ff007f"
:"var(--purple)";

});

}

function updatePlayerProgress(){

document.querySelectorAll(".song-card").forEach(card=>{

const id=card.dataset.songId;

if(!id)return;

const song=songs.find(s=>s.id===id);

if(!song)return;

const progress=card.querySelector(".progress");
const elapsed=card.querySelector(".elapsed");
const total=card.querySelector(".total-time");

if(!progress)return;

const active=id===currentSongId;

const current=active
?audio.currentTime||0
:0;

const duration=active&&
Number.isFinite(audio.duration)&&
audio.duration>0
?audio.duration
:Number(song.duration)||0;

progress.max=Math.max(duration,1);

progress.value=Math.min(
current,
Number(progress.max)
);

const percent=duration>0
?Math.min(100,(current/duration)*100)
:0;

progress.style.setProperty(
"--progress",
percent+"%"
);

progress.disabled=duration<=0;

if(elapsed){
elapsed.textContent=formatTime(current);
}

if(total){
total.textContent=formatTime(duration);
}

});

}

// ==========================================
// SEEK
// ==========================================

document.addEventListener("input",event=>{

const progress=event.target.closest(".progress");

if(!progress)return;

const id=progress.dataset.songId;

if(id!==currentSongId)return;

const duration=Number(audio.duration);

if(
!Number.isFinite(duration)||
duration<=0
){
return;
}

const target=Math.max(
0,
Math.min(
duration,
Number(progress.value)
)
);

if(Number.isFinite(target)){
try{
audio.currentTime=target;
}catch(error){
console.warn("Seek:",error);
}
}

updatePlayerProgress();

});

// ==========================================
// AUDIO EVENTS
// ==========================================

audio.addEventListener("loadstart",()=>{
audioLoading=true;
updatePlayerButtons();
});

audio.addEventListener("waiting",()=>{
audioLoading=true;
updatePlayerButtons();
});

audio.addEventListener("stalled",()=>{
audioLoading=true;
updatePlayerButtons();
});

audio.addEventListener("playing",()=>{
audioLoading=false;
updatePlayerButtons();
});

audio.addEventListener("canplay",()=>{
audioLoading=false;
updatePlayerButtons();
});

audio.addEventListener(
"play",
updatePlayerButtons
);

audio.addEventListener(
"pause",
updatePlayerButtons
);

audio.addEventListener("ended",()=>{

audio.currentTime=0;
currentSongId=null;
audioLoading=false;

updatePlayerButtons();
updatePlayerProgress();

});

audio.addEventListener(
"timeupdate",
updatePlayerProgress
);

audio.addEventListener(
"durationchange",
updatePlayerProgress
);

audio.addEventListener(
"seeked",
updatePlayerProgress
);

audio.addEventListener(
"loadedmetadata",
()=>{

const song=songs.find(
s=>s.id===currentSongId
);

if(
song&&
Number.isFinite(audio.duration)&&
audio.duration>0
){

song.duration=audio.duration;
song.time=formatTime(audio.duration);

save();

}

updatePlayerProgress();

}
);

audio.addEventListener("error",()=>{

audioLoading=false;
updatePlayerButtons();

});

// ==========================================
// DOWNLOAD
// ==========================================

function downloadSong(id){

    const song = songs.find(
        s => s.id === id
    );

    if (!song) return;

    if (downloading.has(id)) return;

    // Badala ya kutumia DOWNLOAD_URL (ambayo inaweza kuwa ina-redirect kwenye file lenyewe
    // na kufanya browser ifungue wimbo badala ya ku-download), tutatumia 'fetch' moja kwa moja
    // kwenye audioUrl ili kulazimisha kivinjari i-download kwa kutumia 'Blob'.
    
    const audioUrl = song.audioUrl;
    
    if (!audioUrl) {
         showPopup(
            "Download",
            "Wimbo huu hauna URL ya kupakua."
        );
        return;
    }

    downloading.add(id);
    updateDownloadButtons();

    toast(tr("downloadStart"));

    // Fetch the audio file as a Blob
    fetch(audioUrl)
        .then(response => {
            if (!response.ok) {
                 throw new Error('Network response was not ok');
            }
            return response.blob();
        })
        .then(blob => {
            // Tengeneza temporary URL kwa ajili ya hilo faili (blob)
            const blobUrl = window.URL.createObjectURL(blob);
            
            // Tengeneza link element (<a>) kwa ajili ya kudownload
            const link = document.createElement('a');
            link.style.display = 'none';
            link.href = blobUrl;
            
            // Set jina la faili (+.mp3)
            link.download = safeFilename(song.title) + ".mp3";
            
            document.body.appendChild(link);
            link.click();
            
            // Safisha memory baada ya kubonyeza
            setTimeout(() => {
                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobUrl);
            }, 100);
            
            // Maliza download process kwenye UI
            downloading.delete(id);
            updateDownloadButtons();
        })
        .catch(error => {
            console.error('Download failed:', error);
            showPopup(
                "Download Error",
                "Imeshindwa kupakua wimbo moja kwa moja. Inawezekana kuna tatizo la CORS. Tafadhali jaribu tena baadaye."
            );
            downloading.delete(id);
            updateDownloadButtons();
        });
}

function downloadSelectedSong(){

const id=selectedSongId;

closeSheets();

if(!id)return;

downloadSong(id);

}

function updateDownloadButtons(){

document.querySelectorAll(
'[data-action="download"]'
).forEach(button=>{

const active=downloading.has(
button.dataset.id
);

button.disabled=active;

button.classList.toggle(
"downloading",
active
);

button.innerHTML=active
?'<i class="fa-solid fa-spinner fa-spin"></i>'
:'<i class="fa-solid fa-download"></i>';

});

}

// ==========================================
// FAVORITES
// ==========================================

function toggleFavorite(id){

const song=songs.find(
s=>s.id===id
);

if(!song)return;

song.isFav=!song.isFav;

save();
renderSongs();

}

// ==========================================
// SONG OPTIONS
// ==========================================

function openSongOptions(id){

const song=songs.find(
s=>s.id===id
);

if(!song)return;

selectedSongId=id;

el("sheet-song-title").textContent=
song.title;

el("song-sheet").classList.add("show");

}

// ==========================================
// SHARE
// ==========================================

async function shareSelectedSong(){

const song=songs.find(
s=>s.id===selectedSongId
);

closeSheets();

if(!song)return;

try{

if(navigator.share){

await navigator.share({
title:song.title,
url:song.audioUrl
});

}else if(navigator.clipboard){

await navigator.clipboard.writeText(
song.audioUrl
);

toast(tr("copied"));

}else{

showPopup(
tr("share"),
song.audioUrl
);

}

}catch(error){

if(error.name!=="AbortError"){
console.warn(error);
}

}

}

// ==========================================
// DELETE
// ==========================================

function deleteSelectedSong(){

const id=selectedSongId;

closeSheets();

showPopup(
tr("delete"),
tr("confirmDelete"),
()=>{

if(currentSongId===id){

audio.pause();
audio.removeAttribute("src");
audio.load();

currentSongId=null;
audioLoading=false;

}

songs=songs.filter(
s=>s.id!==id
);

save();
renderSongs();

toast(tr("deleted"));

}
);

}

// ==========================================
// SETTINGS
// ==========================================

function openSettings(){
el("settings-sheet").classList.add("show");
}

function closeSheets(){

document.querySelectorAll(".sheet").forEach(x=>{
x.classList.remove("show");
});

}

// ==========================================
// TOP UP
// ==========================================

function updatePayText(){

const prefix=
lang==="en"
?"PAY TSH "
:lang==="fr"
?"PAYER TSH "
:"LIPA TSH ";

el("pay-text").textContent=
prefix+
selectedPrice.toLocaleString("en-US");

}

function selectPackage(price){

selectedPrice=price;

document.querySelectorAll(".package").forEach(x=>{
x.classList.toggle(
"active",
Number(x.dataset.price)===price
);
});

updatePayText();

}

// ==========================================
// BUTTON ACTIONS
// ==========================================

document.addEventListener("click",event=>{

const button=event.target.closest(
"[data-action]"
);

if(!button)return;

const action=button.dataset.action;
const id=button.dataset.id;

if(action==="play"){
playSong(id);
}

if(action==="download"){
downloadSong(id);
}

if(action==="favorite"){
toggleFavorite(id);
}

if(action==="options"){
openSongOptions(id);
}

if(action==="remove-task"){

tasks=tasks.filter(
t=>t.task_id!==id
);

save();
renderSongs();

}

});

// ==========================================
// INITIALIZE
// ==========================================

function initialize(){

load();

setupTags("voice-tags");

let savedLanguage=null;

try{
savedLanguage=localStorage.getItem(
"aiMusicLang"
);
}catch{}

if(
savedLanguage&&
translations[savedLanguage]
){

selectLanguage(savedLanguage);

}else{

el("language-page").classList.add(
"active"
);

}

resumeTasks();
renderSongs();

}

if(document.readyState==="loading"){

document.addEventListener(
"DOMContentLoaded",
initialize
);

}else{

initialize();

}
</script>
